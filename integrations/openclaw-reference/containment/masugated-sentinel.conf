server {
    listen 8000;
    server_name _;

    # The live containment oracle invokes the real MasuGate OpenClaw plugin only
    # against this bounded sentinel.  It returns a syntactically valid,
    # non-provider committed envelope so the test proves plugin execution and
    # does not claim a live purchase or provider effect.
    location = /v1/actions {
        default_type application/json;
        return 200 '{"operation_id":"11111111-1111-4111-8111-111111111111","status":"committed","decision":{"effect":"allow","policy_id":"reference-containment-sentinel","policy_version":"1","rule_id":"bounded-plugin-execution","reason":"reference containment sentinel"},"payload":{"receipt":"reference-containment-governed-plugin"},"audit_ref":"/v1/audit/11111111-1111-4111-8111-111111111111","replayed":false}';
    }

    location / {
        default_type text/plain;
        return 200 "masugated sentinel\n";
    }
}

server {
    listen 8081;
    server_name _;

    location = /healthz {
        return 200;
    }

    location / {
        if ($http_x_reference_purchase_token != "reference-containment-connector-token") {
            return 401;
        }
        default_type text/plain;
        return 200 "reference purchase sentinel\n";
    }
}

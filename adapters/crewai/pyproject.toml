[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masugate-crewai"
version = "0.1.0"
description = "Exact-artifact CrewAI BaseTool replacement-only adapter for MasuGate"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "crewai==1.15.6",
    "pydantic>=2.12,<3",
    "masugate-adapter-core>=0.1,<1",
]

[project.urls]
Homepage = "https://github.com/masugate/masugate"
Source = "https://github.com/masugate/masugate"
Issues = "https://github.com/masugate/masugate/issues"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/masugate_crewai"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/requirements.txt",
    "/src/masugate_crewai",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/masugate_crewai"]
mypy_path = ["../python/src", "../../clients/python/src"]

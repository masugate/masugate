[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masugate-adapter-core"
version = "0.1.0"
description = "Framework-neutral governed tool runtime for MasuGate adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "masugate-client>=0.1,<1",
]

[project.urls]
Homepage = "https://github.com/masugate/masugate"
Source = "https://github.com/masugate/masugate"
Issues = "https://github.com/masugate/masugate/issues"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/masugate_adapter_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/masugate_adapter_core/adapter-core-conformance.json" = "masugate_adapter_core/adapter-core-conformance.json"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/masugate_adapter_core",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/masugate_adapter_core"]
mypy_path = ["../../clients/python/src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masugate-operation-spend"
version = "0.1.0"
description = "Existing spend.purchase operation pack for MasuGate"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = ["masugate==0.1.0", "masugate-connector-sdk==0.1.0"]

[project.urls]
Homepage = "https://github.com/masugate/masugate"
Source = "https://github.com/masugate/masugate"
Issues = "https://github.com/masugate/masugate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/masugate_operation_spend"]

[tool.hatch.build.targets.wheel.force-include]
"src/masugate_operation_spend/operation-pack.json" = "masugate_operation_spend/operation-pack.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masugate-operation-filesystem"
version = "0.1.0"
description = "Bounded protected filesystem operation pack for MasuGate"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = ["masugate==0.1.0", "masugate-connector-sdk==0.1.0"]

[project.urls]
Homepage = "https://github.com/MasuGateGovernance/MasuGate"
Source = "https://github.com/MasuGateGovernance/MasuGate"
Issues = "https://github.com/MasuGateGovernance/MasuGate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/masugate_operation_filesystem"]

[tool.hatch.build.targets.wheel.force-include]
"src/masugate_operation_filesystem/operation-pack.json" = "masugate_operation_filesystem/operation-pack.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masugate-connector-sdk"
version = "0.1.1"
description = "Public connector-author contract for MasuGate protected workers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = []

[project.urls]
Homepage = "https://github.com/masugate/masugate"
Source = "https://github.com/masugate/masugate"
Issues = "https://github.com/masugate/masugate/issues"

[project.scripts]
masugate-connector-conformance = "masugate_connector_sdk.conformance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/masugate_connector_sdk"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/masugate_connector_sdk"]

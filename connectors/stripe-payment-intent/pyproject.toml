[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masugate-connector-stripe-payment-intent"
version = "0.1.0"
description = "Exact Stripe PaymentIntent test-mode profile for MasuGate"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = ["masugate-connector-sdk==0.1.0"]

[project.urls]
Homepage = "https://github.com/MasuGateGovernance/MasuGate"
Source = "https://github.com/MasuGateGovernance/MasuGate"
Issues = "https://github.com/MasuGateGovernance/MasuGate/issues"

[project.entry-points."masugate.connector"]
stripe-payment-intent = "masugate_connector_stripe_payment_intent:connector"

[tool.hatch.build.targets.wheel]
packages = ["src/masugate_connector_stripe_payment_intent"]

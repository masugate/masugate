name: MasuGate trusted-publishing design

# This file records a future OIDC release shape only. The public source release
# does not publish packages or containers: every job remains disabled, no
# registry trust relationship is configured here, and no publisher configuration
# is created by this file.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact reviewed release identifier
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-release-controls:
    if: ${{ false }} # Disabled until package-release authorization.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - name: Verify staged release inputs
        run: |
          python scripts/verify-release-controls.py
          python scripts/build-reference-release.py --verify-only

  pypi-trusted-publishing:
    if: ${{ false }} # Disabled until an authorized environment is configured.
    needs: verify-release-controls
    environment: masugate-release
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed before any publisher is configured
        run: exit 1

  npm-trusted-publishing:
    if: ${{ false }} # Disabled until an authorized environment is configured.
    needs: verify-release-controls
    environment: masugate-release
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed before any publisher is configured
        run: exit 1

  container-attestation:
    if: ${{ false }} # Disabled until an authorized environment is configured.
    needs: verify-release-controls
    environment: masugate-release
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed before any publisher is configured
        run: exit 1

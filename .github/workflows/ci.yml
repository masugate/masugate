name: Source checks

# This workflow validates the source tree only. It retrieves only
# hash-locked verifier inputs, has no credentials, publishes no artifacts, and
# does not enable registry or container release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-locked descriptor verifier inputs
        run: python -m pip install --require-hashes -r release/requirements/reference-demo-build.requirements.lock
      - name: Install in-tree connector SDK
        run: python -m pip install --no-build-isolation --no-deps ./connectors/sdk
      - name: Verify release controls
        run: python scripts/verify-release-controls.py
      - name: Verify reader documentation
        run: python scripts/verify-documentation.py
      - name: Verify release descriptor
        run: PYTHONPATH=src python scripts/build-reference-release.py --verify-only

  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12
      - name: Install hash-locked test inputs
        run: python -m pip install --require-hashes -r release/requirements/reference-demo-build.requirements.lock
      - name: Install in-tree connector SDK
        run: python -m pip install --no-build-isolation --no-deps ./connectors/sdk
      - name: Install in-tree platform package
        run: python -m pip install --no-build-isolation --no-deps .
      - name: Run deterministic Python implementation tests
        run: python -m pytest

  node-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12
      - name: Install hash-locked Python conformance inputs
        run: python -m pip install --require-hashes -r release/requirements/reference-demo-build.requirements.lock
      - name: Install in-tree connector SDK
        run: python -m pip install --no-build-isolation --no-deps ./connectors/sdk
      - name: Install in-tree platform package
        run: python -m pip install --no-build-isolation --no-deps .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node workspace inputs
        run: npm ci
      - name: Build Node workspaces
        run: npm run build
      - name: Type-check Node workspaces
        run: npm run typecheck
      - name: Run Node workspace tests
        run: npm test

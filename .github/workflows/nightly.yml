name: MasuGate dormant compatibility gate

# This resource-intensive compatibility profile remains deliberately dormant.
# The public source CI workflow performs the lightweight controls on each
# change; this profile needs separately provisioned runtime inputs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-closure:
    if: ${{ false }} # Disabled until its provisioned compatibility profile is authorized.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
      - name: Verify release controls and compatibility matrix
        run: |
          python scripts/verify-release-controls.py
          python scripts/build-reference-release.py --verify-only

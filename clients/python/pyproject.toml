[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masugate-client"
version = "0.1.1"
description = "Typed asynchronous Python client for the MasuGate Governed Action Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/masugate/masugate"
Source = "https://github.com/masugate/masugate"
Issues = "https://github.com/masugate/masugate/issues"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/masugate_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/masugate_client"]
